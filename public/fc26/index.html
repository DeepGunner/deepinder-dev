<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FC 26 · World Cup Tracker — Friends Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pitch:   #070B08;   /* near-black green */
    --pitch-2: #0D140E;
    --line:    #1C2A1E;   /* faint pitch lines */
    --green:   #3DFC6E;   /* electric FC green */
    --gold:    #F2C648;   /* trophy gold */
    --white:   #F2F6F1;
    --muted:   #7E8C80;
  }
  html, body { height: 100%; }
  body {
    background: var(--pitch);
    color: var(--white);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    overflow: hidden;
  }
  /* gold accent bar, like the tracker's top edge */
  .bar {
    position: fixed; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--gold), #B98E1E 60%, transparent);
  }
  /* faint centre-circle pitch marking */
  .circle {
    position: fixed; left: 50%; top: 50%;
    width: min(120vmin, 900px); aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 1.5px solid var(--line);
    border-radius: 50%;
    pointer-events: none;
  }
  .circle::after {
    content: ""; position: absolute; inset: 18%;
    border: 1.5px solid var(--line); border-radius: 50%;
  }
  /* halfway line */
  .halfway {
    position: fixed; left: 0; right: 0; top: 50%;
    border-top: 1.5px solid var(--line);
    pointer-events: none;
  }
  main { position: relative; text-align: center; max-width: 34rem; }
  /* hex badge */
  .hex {
    width: 84px; height: 96px;
    margin: 0 auto 1.75rem;
    display: grid; place-items: center;
    background: var(--pitch-2);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    position: relative;
    filter: drop-shadow(0 0 14px rgba(61, 252, 110, 0.45));
  }
  .hex::before {
    content: ""; position: absolute; inset: 3px;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background: var(--pitch);
  }
  .hex span {
    position: relative;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700; font-size: 1.5rem;
    line-height: 1.05;
    color: var(--green);
    text-shadow: 0 0 12px rgba(61, 252, 110, 0.6);
  }
  .hex { background: var(--green); }
  .kicker {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600; font-size: 0.8rem;
    letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.9rem;
  }
  h1 {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: clamp(2.1rem, 8vw, 3.4rem);
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 1.1rem;
  }
  h1 em { font-style: normal; color: var(--green); text-shadow: 0 0 18px rgba(61,252,110,.35); }
  p.sub { color: var(--muted); line-height: 1.6; max-width: 26rem; margin: 0 auto 2rem; }
  .pill {
    display: inline-block;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600; font-size: 0.78rem;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--green);
    border: 1px solid rgba(61, 252, 110, 0.5);
    border-radius: 999px;
    padding: 0.55rem 1.2rem;
    background: rgba(61, 252, 110, 0.07);
    box-shadow: inset 0 0 18px rgba(61, 252, 110, 0.08);
  }
  .dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--green);
    margin-right: 0.55rem; vertical-align: 1px;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .foot {
    margin-top: 2.5rem;
    font-size: 0.78rem; letter-spacing: 0.06em;
    color: var(--muted);
  }
  .foot a { color: var(--gold); text-decoration: none; }
  .foot a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="halfway"></div>
  <div class="circle"></div>
  <main>
    <div class="hex"><span>FC<br>26</span></div>
    <p class="kicker">FIFA World Cup Tracker · Friends Edition</p>
    <h1>Kickoff <em>coming soon</em></h1>
    <p class="sub">Group stage, knockouts, and a champion — the bracket and fixtures will live right here.</p>
    <span class="pill"><span class="dot"></span>Squad assembling</span>
    <p class="foot"><a href="https://deepinder.dev">deepinder.dev</a></p>
  </main>
</body>
    </html>
