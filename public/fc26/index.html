
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FC 26 FIFA World Cup Tracker</title>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-panel: #111111;
    --bg-card: #141414;
    --bg-row: #0d0d0d;
    --border: #1f2937;
    --border-light: #262626;
    --text: #e5e7eb;
    --text-dim: #9ca3af;
    --text-faint: #6b7280;
    --accent: #00ff88;
    --accent-dark: #0a0a0a;
    --accent-bg: #0f1f17;
    --accent-border: #1a3326;
    --danger: #f87171;
    --danger-bg: #1a1010;
    --danger-border: #3a1a1a;
    --warn: #fbbf24;
    --warn-bg: #1f1a0a;
    --warn-border: #3a2f12;
    --gold: #d4af37;
    --gold-light: #f5d775;
    --navy: #0c1e3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    border-bottom: 1px solid var(--border);
    border-top: 3px solid var(--gold);
    background: linear-gradient(180deg, #14110a 0%, #0f0f0f 100%);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .badge-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-text-wrap {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .brand-title .accent-fc {
    color: var(--accent);
  }
  .brand-title .accent-wc {
    color: var(--gold-light);
  }
  .brand-subtitle {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .save-status {
    font-size: 12px;
    color: var(--text-faint);
    min-width: 50px;
  }
  .view-toggle {
    display: flex;
    background: #1a1a1a;
    border-radius: 8px;
    padding: 3px;
    border: 1px solid var(--border-light);
  }
  .toggle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .toggle-btn.active {
    background: var(--accent);
    color: var(--accent-dark);
  }
  .main {
    flex: 1;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px;
  }
  .footer {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
  }
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: sticky;
    top: 80px;
  }
  @media (max-width: 800px) {
    .sidebar { position: static; }
  }
  .sidebar-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    cursor: pointer;
  }
  .sidebar-item.active {
    border: 1px solid var(--accent);
    background: var(--accent-bg);
  }
  .sidebar-item-name {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sidebar-item-meta {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--text-faint);
  }
  .new-tournament-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--accent);
    color: var(--accent-dark);
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 4px;
    width: 100%;
  }
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    gap: 8px;
  }
  .empty-title { font-size: 18px; margin: 8px 0 0; }
  .empty-text { color: var(--text-faint); font-size: 14px; margin: 0; }

  .tournament-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tournament-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .status-badge {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    padding: 5px 12px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .section { margin-bottom: 32px; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .add-player-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  input, select {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  input:focus, select:focus {
    border-color: var(--accent);
  }
  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--accent);
    color: var(--accent-dark);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border-light);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-link {
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    border: 1px solid var(--border-light);
    border-radius: 6px;
    color: var(--text);
    width: 28px;
    height: 28px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn-danger {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    border-radius: 6px;
    color: var(--danger);
    width: 28px;
    height: 28px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .player-card {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .player-name {
    margin: 0;
    font-weight: 600;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .player-team {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .group-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .group-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
  table.standings { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 12px; }
  table.standings th {
    text-align: center;
    padding: 4px 6px;
    color: var(--text-faint);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  table.standings th:first-child, table.standings td:first-child { text-align: left; }
  table.standings td {
    text-align: center;
    padding: 6px;
    border-bottom: 1px solid #1a1a1a;
  }
  tr.advancing { background: var(--accent-bg); }
  .standings-name { font-weight: 600; font-size: 13px; }
  .standings-team { font-size: 11px; color: var(--text-faint); }
  .match-list { display: flex; flex-direction: column; gap: 8px; }
  .match-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-row);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    flex-wrap: wrap;
    position: relative;
  }
  .match-player { flex: 1; min-width: 100px; display: flex; flex-direction: column; }
  .match-player.right { align-items: flex-end; text-align: right; }
  .match-player-name { font-size: 13px; font-weight: 600; }
  .match-player-team { font-size: 11px; color: var(--text-faint); }
  .match-player.winner { color: var(--accent); }
  .score-inputs { display: flex; align-items: center; gap: 6px; }
  .score-input {
    width: 44px;
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 4px;
    font-size: 14px;
    text-align: center;
    outline: none;
  }
  .score-dash { color: var(--text-faint); }
  .score-display { font-size: 14px; font-weight: 700; min-width: 50px; text-align: center; }
  .bye-badge {
    font-size: 11px;
    color: var(--warn);
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 999px;
    padding: 4px 10px;
    font-weight: 600;
  }
  .draw-warning { width: 100%; font-size: 11px; color: var(--danger); margin-top: 4px; }
  .penalty-section {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border-light);
  }
  .penalty-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--gold-light);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .penalty-input {
    width: 36px;
    background: var(--bg-card);
    border: 1px solid var(--gold);
    border-radius: 6px;
    color: var(--text);
    padding: 4px;
    font-size: 13px;
    text-align: center;
    outline: none;
  }
  .penalty-display {
    font-size: 12px;
    font-weight: 700;
    color: var(--gold-light);
  }
  .hint-text { font-size: 12px; color: var(--text-faint); margin-top: 8px; }
  .bracket-wrap { display: flex; flex-direction: column; gap: 16px; }
  .bracket-round {
    width: 100%;
    max-width: 480px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .round-title { font-size: 14px; font-weight: 700; margin: 0 0 12px; }

  /* Wallchart */
  .wallchart {
    background:
      radial-gradient(ellipse at center, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0) 60%),
      repeating-linear-gradient(0deg, #163a23, #163a23 40px, #15391f 40px, #15391f 80px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    overflow-x: auto;
  }
  .wallchart-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid rgba(255,255,255,0.12);
  }
  .wallchart-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }
  .wallchart-title .accent-wc { color: var(--gold-light); }
  .wallchart-body {
    display: grid;
    grid-template-columns: minmax(220px, 280px) 1fr minmax(220px, 280px);
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 1100px) {
    .wallchart-body { grid-template-columns: 1fr; }
  }
  .wallchart-groups-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .wallchart-group-card {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .wallchart-group-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--gold-light);
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .wallchart-group-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    padding: 3px 0;
    color: #f3f4f6;
  }
  .wallchart-group-row.advancing { font-weight: 800; color: #ffffff; }
  .wallchart-group-row .wgr-team {
    color: #d1fae5;
    font-size: 10px;
  }
  .wallchart-group-row.advancing .wgr-team { color: var(--gold-light); }
  .wallchart-bracket-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .wallchart-rounds {
    display: flex;
    flex-direction: row;
    gap: 8px;
    align-items: center;
    overflow-x: auto;
    padding: 8px 0;
    width: 100%;
    justify-content: center;
  }
  .wallchart-round-col {
    display: flex;
    flex-direction: column;
    gap: 14px;
    justify-content: center;
    align-items: center;
    min-width: 150px;
    max-width: 320px;
    flex: 0 0 auto;
  }
  .wallchart-round-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-light);
    flex: 0 0 auto;
    align-self: center;
  }
  .wallchart-match-box {
    width: 100%;
    max-width: 260px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    overflow: hidden;
    font-size: 11px;
    position: relative;
  }

  /* Group stage block */
  .wallchart-group-block {
    margin-bottom: 18px;
  }
  .wallchart-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px;
    color: #f3f4f6;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .wallchart-row:last-child { border-bottom: none; }
  .wallchart-row.winner { background: rgba(212,175,55,0.18); color: #ffffff; font-weight: 800; }
  .wallchart-row .wr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
  .wallchart-row .wr-score { font-weight: 700; min-width: 16px; text-align: right; }
  .wallchart-final-box {
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    border: 2px solid #fff;
    border-radius: 8px;
    padding: 10px 16px;
    text-align: center;
    color: var(--navy);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    min-width: 150px;
  }
  .wallchart-champion-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 2px solid rgba(255,255,255,0.12);
  }
  .wallchart-champion-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-light);
  }
  .wallchart-champion-name {
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
  }
  .wallchart-champion-team {
    font-size: 12px;
    color: var(--gold-light);
  }
  .champion-banner {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
    color: var(--navy);
    border-radius: 14px;
    padding: 20px 24px;
    margin-top: 24px;
  }
  .champion-label {
    margin: 0; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.7;
  }
  .champion-name { margin: 4px 0 0; font-size: 24px; font-weight: 800; }
  .champion-team { margin: 2px 0 0; font-size: 14px; font-weight: 600; opacity: 0.8; }

  /* Wooden spoon - worst player award */
  .wooden-spoon-banner {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, #3a1a1a 0%, #1a0d0d 100%);
    border: 1px solid var(--danger-border);
    color: var(--text);
    border-radius: 14px;
    padding: 20px 24px;
    margin-top: 16px;
  }
  .wooden-spoon-emoji {
    color: var(--danger);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    font-size: 48px;
    line-height: 1;
  }
  .wooden-spoon-label {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--danger);
    opacity: 0.85;
  }
  .wooden-spoon-name { margin: 4px 0 0; font-size: 22px; font-weight: 800; }
  .wooden-spoon-team { margin: 2px 0 0; font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .wooden-spoon-stats { margin: 6px 0 0; font-size: 12px; color: var(--text-faint); }
  .wooden-spoon-quip {
    margin: 8px 0 0;
    font-size: 13px;
    font-style: italic;
    color: var(--text-dim);
  }
  .wooden-spoon-quip strong {
    color: var(--danger);
    font-style: normal;
  }

  /* Champion celebration banner with fireworks */
  .champion-celebration {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #0c1e3d 0%, #16213a 60%, #0a0a0a 100%);
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 28px 20px;
    margin-bottom: 24px;
    text-align: center;
  }
  .celebration-fireworks {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .firework {
    position: absolute;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    animation: firework-burst 2.4s ease-out infinite;
  }
  @keyframes firework-burst {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
  }
  .celebration-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .celebration-trophy {
    perspective: 400px;
    margin-bottom: 4px;
    filter: drop-shadow(0 4px 12px rgba(212,175,55,0.45));
  }
  .celebration-trophy svg {
    animation: trophy-spin 5s linear infinite;
    transform-style: preserve-3d;
  }
  @keyframes trophy-spin {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
  }
  .celebration-label {
    margin: 6px 0 0;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-light);
  }
  .celebration-name {
    margin: 4px 0 0;
    font-size: 34px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 12px rgba(212,175,55,0.4);
  }
  .celebration-team {
    margin: 2px 0 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--gold-light);
  }
  @media (max-width: 600px) {

  var SPECIAL_FLAGS = {

  var ARROW_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';

    trophyBig: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
    crest: '<svg width="48" height="48" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#1a1306" stroke="var(--gold)" stroke-width="1.5"/><path d="M14 12h12v4a6 6 0 0 1-12 0v-4z" fill="var(--gold-light)"/><path d="M14 13h-3a3 3 0 0 0 3 3" fill="none" stroke="var(--gold-light)" stroke-width="1.2"/><path d="M26 13h3a3 3 0 0 1-3 3" fill="none" stroke="var(--gold-light)" stroke-width="1.2"/><rect x="18.5" y="22" width="3" height="3" fill="var(--gold-light)"/><path d="M15 28h10l-1.5-2h-7z" fill="var(--gold-light)"/><path d="M20 6.5l0.7 1.5 1.6 0.2-1.2 1.1 0.3 1.6-1.4-0.8-1.4 0.8 0.3-1.6-1.2-1.1 1.6-0.2z" fill="var(--gold-light)"/></svg>',
    donkey: '\uD83E\uDDB4'
  };

  // ---------------- ID helper ----------------
  var idCounter = 0;
  function uid(prefix) {
    idCounter += 1;
    return (prefix || 'id') + '_' + Date.now() + '_' + idCounter + '_' + Math.floor(Math.random() * 10000);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ---------------- Storage (Supabase) ----------------
  var SUPABASE_URL = 'https://ngfohaxyhddpktyngldl.supabase.co/rest/v1';
  var SUPABASE_KEY = 'sb_publishable_w6sEpEawBXK0V2xcdvlu0g_c7u_UvB5';
  var SUPABASE_ROW_ID = 'main';

  var SUPABASE_HEADERS = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };

  async function loadTournaments() {
    try {
      var res = await fetch(
        SUPABASE_URL + '/tournaments_data?id=eq.' + SUPABASE_ROW_ID + '&select=data',
        { headers: SUPABASE_HEADERS }
      );
      if (!res.ok) throw new Error('Failed to load: ' + res.status);
      var rows = await res.json();
      if (rows && rows.length > 0 && rows[0].data) {
        return rows[0].data;
      }
      return [];
    } catch (e) {
      console.error('Load failed', e);
      return [];
    }
  }

  var saveTimeout = null;
  function persist() {
    setSaveStatus('saving');
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async function () {
      try {
        var res = await fetch(
          SUPABASE_URL + '/tournaments_data?on_conflict=id',
          {
            method: 'POST',
            headers: Object.assign({}, SUPABASE_HEADERS, { 'Prefer': 'resolution=merge-duplicates' }),
            body: JSON.stringify({ id: SUPABASE_ROW_ID, data: state.tournaments, updated_at: new Date().toISOString() })
          }
        );
        if (!res.ok) throw new Error('Failed to save: ' + res.status);
        setSaveStatus('saved');
        setTimeout(function () { setSaveStatus(''); }, 1200);
      } catch (e) {
        setSaveStatus('');
        console.error('Save failed', e);
      }
    }, 250);
  }

  function setSaveStatus(s) {
    var el = document.getElementById('save-status');
    if (s === 'saving') el.textContent = 'Saving...';
    else if (s === 'saved') el.textContent = 'Saved';
    else el.textContent = '';
  }

  // ---------------- Tournament logic ----------------
  function newTournament(name) {
    return {
      id: uid('tourn'),
      name: name || 'New Tournament',
      createdAt: Date.now(),
      status: 'setup', // setup | group | knockout | completed
      players: [],
      groups: [],
      groupMatches: {},
      knockoutRounds: [],
      champion: null
    };
  }

  function makeGroups(playerIds) {
    var shuffled = playerIds.slice().sort(function () { return Math.random() - 0.5; });
    var n = shuffled.length;
    var groupCount = Math.round(n / 4);
    if (groupCount < 1) groupCount = 1;
    var groups = [];
    for (var i = 0; i < groupCount; i++) groups.push([]);
    shuffled.forEach(function (id, i) {
      groups[i % groupCount].push(id);
    });
    return groups;
  }

  function roundRobinMatches(groupPlayerIds) {
    var matches = [];
    for (var i = 0; i < groupPlayerIds.length; i++) {
      for (var j = i + 1; j < groupPlayerIds.length; j++) {
        matches.push({
          id: uid('match'),
          playerA: groupPlayerIds[i],
          playerB: groupPlayerIds[j],
          scoreA: null,
          scoreB: null,
          completed: false
        });
      }
    }
    return matches;
  }

  function calcStandings(groupPlayerIds, matches) {
    var stats = {};
    groupPlayerIds.forEach(function (id) {
      stats[id] = { id: id, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0, points: 0 };
    });
    matches.forEach(function (m) {
      if (!m.completed) return;
      var a = stats[m.playerA];
      var b = stats[m.playerB];
      if (!a || !b) return;
      a.played += 1;
      b.played += 1;
      a.gf += m.scoreA;
      a.ga += m.scoreB;
      b.gf += m.scoreB;
      b.ga += m.scoreA;
      if (m.scoreA > m.scoreB) {
        a.won += 1; a.points += 3; b.lost += 1;
      } else if (m.scoreA < m.scoreB) {
        b.won += 1; b.points += 3; a.lost += 1;
      } else {
        a.drawn += 1; b.drawn += 1; a.points += 1; b.points += 1;
      }
    });
    Object.keys(stats).forEach(function (k) { stats[k].gd = stats[k].gf - stats[k].ga; });
    return Object.keys(stats).map(function (k) { return stats[k]; }).sort(function (x, y) {
      if (y.points !== x.points) return y.points - x.points;
      if (y.gd !== x.gd) return y.gd - x.gd;
      if (y.gf !== x.gf) return y.gf - x.gf;
      return 0;
    });
  }

  // Aggregate every completed match (group + knockout) across the whole
  // tournament per player, then find the player with the worst overall
  // record - most losses, then worst goal difference, then fewest goals scored.
  function getWorstPlayer(t) {
    var stats = {};
    t.players.forEach(function (p) {
      stats[p.id] = { id: p.id, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0 };
    });

    var allMatches = [];
    t.groups.forEach(function (g) {
      (t.groupMatches[g.id] || []).forEach(function (m) { allMatches.push(m); });
    });
    (t.knockoutRounds || []).forEach(function (r) {
      r.matches.forEach(function (m) { allMatches.push(m); });
    });

    allMatches.forEach(function (m) {
      if (m.bye || !m.completed) return;
      var a = stats[m.playerA];
      var b = stats[m.playerB];
      if (!a || !b) return;
      a.played += 1;
      b.played += 1;
      a.gf += m.scoreA;
      a.ga += m.scoreB;
      b.gf += m.scoreB;
      b.ga += m.scoreA;

      // Determine winner, accounting for penalty shootouts on level scores
      var winnerId = getMatchWinner(m);
      if (winnerId === m.playerA) {
        a.won += 1; b.lost += 1;
      } else if (winnerId === m.playerB) {
        b.won += 1; a.lost += 1;
      } else {
        a.drawn += 1; b.drawn += 1;
      }
    });

    Object.keys(stats).forEach(function (k) { stats[k].gd = stats[k].gf - stats[k].ga; });

    var withGames = Object.keys(stats).map(function (k) { return stats[k]; }).filter(function (s) { return s.played > 0; });
    if (withGames.length === 0) return null;

    withGames.sort(function (x, y) {
      if (x.lost !== y.lost) return y.lost - x.lost; // most losses first
      if (x.gd !== y.gd) return x.gd - y.gd; // worst goal difference first
      if (x.gf !== y.gf) return x.gf - y.gf; // fewest goals scored first
      return 0;
    });

    var worstStats = withGames[0];
    var worstPlayer = t.players.filter(function (p) { return p.id === worstStats.id; })[0];
    if (!worstPlayer) return null;
    return { player: worstPlayer, stats: worstStats };
  }

  function advanceCount(groupSize) {
    return Math.max(1, Math.round(groupSize / 2));
  }

  function makeKnockoutMatches(playerIds, roundLabel) {
    var shuffled = playerIds.slice().sort(function () { return Math.random() - 0.5; });
    var matches = [];
    var i = 0;
    while (i < shuffled.length) {
      if (i + 1 < shuffled.length) {
        matches.push({
          id: uid('match'),
          playerA: shuffled[i],
          playerB: shuffled[i + 1],
          scoreA: null,
          scoreB: null,
          completed: false,
          bye: false
        });
        i += 2;
      } else {
        matches.push({
          id: uid('match'),
          playerA: shuffled[i],
          playerB: null,
          scoreA: null,
          scoreB: null,
          completed: true,
          bye: true
        });
        i += 1;
      }
    }
    return { round: roundLabel, matches: matches };
  }

  function knockoutRoundLabel(remainingCount) {
    if (remainingCount <= 2) return 'Final';
    if (remainingCount <= 4) return 'Semi-finals';
    if (remainingCount <= 8) return 'Quarter-finals';
    return 'Round of ' + remainingCount;
  }

  function getMatchWinner(match) {
    if (match.bye) return match.playerA;
    if (!match.completed) return null;
    if (match.scoreA > match.scoreB) return match.playerA;
    if (match.scoreB > match.scoreA) return match.playerB;
    // Scores level - check penalties
    if (match.penA !== null && match.penA !== undefined && match.penB !== null && match.penB !== undefined) {
      if (match.penA > match.penB) return match.playerA;
      if (match.penB > match.penA) return match.playerB;
    }
    return null;
  }

      case 'setup': return 'Setting up';

  function render() {
    var scrollX = window.scrollX;
    var scrollY = window.scrollY;

    // Capture focus state so re-rendering innerHTML doesn't steal focus/scroll
    var activeEl = document.activeElement;
    var focusInfo = null;
    if (activeEl && activeEl.tagName && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT' || activeEl.tagName === 'TEXTAREA')) {
      var attrNames = ['data-match-id', 'data-id', 'data-round-idx', 'data-group-id', 'id'];
      var selector = activeEl.tagName.toLowerCase();
      if (activeEl.className) {
        activeEl.className.split(' ').forEach(function (c) {
          if (c) selector += '.' + c;
        });
      }
      attrNames.forEach(function (attr) {
        var val = activeEl.getAttribute(attr);
        if (val !== null) selector += '[' + attr + '="' + val + '"]';
      });
      focusInfo = {
        selector: selector,
        selectionStart: (typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null,
        selectionEnd: (typeof activeEl.selectionEnd === 'number') ? activeEl.selectionEnd : null
      };
    }

    var loadingEl = document.getElementById('loading-screen');
    var appEl = document.getElementById('app');
    loadingEl.classList.add('hidden');
    appEl.classList.remove('hidden');

    if (state.view === 'login') {
      loginView.classList.remove('hidden');
      mainView.classList.add('hidden');
      return;
    }
    loginView.classList.add('hidden');
    mainView.classList.remove('hidden');

    var sidebar = document.getElementById('sidebar');
    var content = document.getElementById('content');
    var adminMode = state.view === 'admin' && state.isAdminAuthed;

    // Sidebar
    var sidebarHtml = '';
    if (adminMode) {
      sidebarHtml += '<button id="new-tournament-btn" class="new-tournament-btn">' + ICONS.plus + ' New tournament</button>';
    }
    if (state.tournaments.length === 0 && !adminMode) {
      sidebarHtml = '';
    } else {
      sidebarHtml += '<div class="sidebar-list">';
      state.tournaments.forEach(function (t) {

        }

    if (state.tournaments.length === 0) {

    } else if (!selected) {
      content.innerHTML = emptyStateHtml({ title: '', text: 'Select a tournament from the list.' });
    } else {
      content.innerHTML = tournamentViewHtml(selected, adminMode);
    }

    attachEventHandlers(adminMode, selected);

    // Restore focus/selection and scroll position so editing doesn't jump the page
    if (focusInfo) {
      try {
        var el = document.querySelector(focusInfo.selector);
        if (el) {
          el.focus();
          if (focusInfo.selectionStart !== null && el.setSelectionRange) {
            el.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd);
          }
        }
      } catch (e) {
        // selector may be invalid in edge cases - ignore
      }
    }
    window.scrollTo(scrollX, scrollY);
  }

            var bScore = m.completed ? m.scoreB : '';
            html += '<div class="wallchart-row' + aClass + '"><span class="wr-name">' + escapeHtml(playerA ? playerA.name : '') + '</span><span class="wr-score">' + aScore + '</span></div>';
            html += '<div class="wallchart-row' + bClass + '"><span class="wr-name">' + escapeHtml(playerB ? playerB.name : 'TBD') + '</span><span class="wr-score">' + bScore + '</span></div>';
            if (m.completed && m.scoreA === m.scoreB && m.penA !== null && m.penA !== undefined && m.penB !== null && m.penB !== undefined) {
              html += '<div style="text-align:center; font-size:10px; color:var(--gold-light); padding:2px 8px 4px; border-top:1px dashed rgba(255,255,255,0.15);">pens ' + m.penA + '-' + m.penB + '</div>';
            }
          }
          html += '</div>';
        });
        html += '</div>'; // round-col
      });
      html += '</div>'; // rounds
    } else {
      html += '<p class="empty-text" style="color:#d1fae5;">Bracket will appear once the group stage is complete.</p>';
    }

    if (t.status === 'completed' && t.champion) {
      var champ = t.players.filter(function (p) { return p.id === t.champion; })[0];
      if (champ) {
        html += '<div class="wallchart-champion-row">';
        html += '<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">';
        html += '<circle cx="20" cy="20" r="18" fill="#1a1306" stroke="var(--gold)" stroke-width="1.5"/>';
        html += '<path d="M14 12h12v4a6 6 0 0 1-12 0v-4z" fill="var(--gold-light)"/>';
        html += '<path d="M14 13h-3a3 3 0 0 0 3 3" fill="none" stroke="var(--gold-light)" stroke-width="1.2"/>';
        html += '<path d="M26 13h3a3 3 0 0 1-3 3" fill="none" stroke="var(--gold-light)" stroke-width="1.2"/>';
        html += '<rect x="18.5" y="22" width="3" height="3" fill="var(--gold-light)"/>';
        html += '<path d="M15 28h10l-1.5-2h-7z" fill="var(--gold-light)"/>';
        html += '<path d="M20 6.5l0.7 1.5 1.6 0.2-1.2 1.1 0.3 1.6-1.4-0.8-1.4 0.8 0.3-1.6-1.2-1.1 1.6-0.2z" fill="var(--gold-light)"/>';
        html += '</svg>';
        html += '<div>';
        html += '<p class="wallchart-champion-label">World Cup champion</p>';
        html += '<p class="wallchart-champion-name">' + escapeHtml(champ.name) + '</p>';
        html += '<p class="wallchart-champion-team">' + flagEmoji(champ.team) + ' ' + escapeHtml(champ.team) + '</p>';
        html += '</div>';
        html += '</div>';
      }
    } else if (t.status === 'knockout') {
      html += '<div class="wallchart-final-box" style="margin-top:14px;">Final TBD</div>';
    }

    html += '</div>'; // bracket-col

    // Right column
    html += '<div class="wallchart-groups-col">' + rightGroups.join('') + '</div>';

    html += '</div>'; // wallchart-body
    html += '</div>'; // wallchart
    html += '</div>'; // section
    return html;
  }

  function groupStageHtml(t, adminMode) {
    var html = '<div class="section">';
    html += '<h2 class="section-title">Group stage</h2>';
    html += '<div class="groups-grid">';

    var allComplete = true;

    t.groups.forEach(function (g, idx) {
      var matches = t.groupMatches[g.id] || [];
      var standings = calcStandings(g.playerIds, matches);
      var advCount = advanceCount(g.playerIds.length);

      matches.forEach(function (m) { if (!m.completed) allComplete = false; });

      html += '<div class="group-card">';
      html += '<h3 class="group-title">Group ' + String.fromCharCode(65 + idx) + '</h3>';
      html += '<table class="standings"><thead><tr>';
      html += '<th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th>';
      html += '</tr></thead><tbody>';

      standings.forEach(function (s, i) {
        var p = t.players.filter(function (pl) { return pl.id === s.id; })[0];
        var rowClass = i < advCount ? ' class="advancing"' : '';
        var gdStr = s.gd > 0 ? ('+' + s.gd) : s.gd;
        html += '<tr' + rowClass + '>';
        html += '<td><div><div class="standings-name">' + escapeHtml(p ? p.name : '') + '</div><div class="standings-team">' + flagEmoji(p ? p.team : '') + ' ' + escapeHtml(p ? p.team : '') + '</div></div></td>';
        html += '<td>' + s.played + '</td><td>' + s.won + '</td><td>' + s.drawn + '</td><td>' + s.lost + '</td><td>' + gdStr + '</td><td style="font-weight:600;">' + s.points + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';

      html += '<div class="match-list">';
      matches.forEach(function (m) {
        html += matchRowHtml(t, m, g.id, -1, adminMode, true);
      });
      html += '</div>';

      html += '</div>'; // group-card
    });

    html += '</div>'; // groups-grid

    if (adminMode && t.status === 'group') {
      html += '<button id="advance-knockout-btn" class="btn-primary" style="margin-top:16px;"' + (allComplete ? '' : ' disabled') + '>' + ICONS.chevron + ' Finish group stage &amp; generate knockout bracket</button>';
      if (!allComplete) {
        html += '<p class="hint-text">Enter all group match scores to continue.</p>';
      }
    }

    html += '</div>'; // section
    return html;
  }

  function knockoutHtml(t, adminMode) {
    var html = '<div class="section">';
    html += '<h2 class="section-title">' + ICONS.award + ' Knockout stage</h2>';
    html += '<div class="bracket-wrap">';

    t.knockoutRounds.forEach(function (round, roundIdx) {
      html += '<div class="bracket-round">';
      html += '<h3 class="round-title">' + escapeHtml(round.round) + '</h3>';
      html += '<div class="match-list">';
      round.matches.forEach(function (m) {
        html += matchRowHtml(t, m, null, roundIdx, adminMode, false);
      });
      html += '</div>';

      var roundComplete = round.matches.every(function (m) { return m.bye || getMatchWinner(m) !== null; });
      var isLastRound = roundIdx === t.knockoutRounds.length - 1;

      if (adminMode && isLastRound && t.status !== 'completed') {
        if (roundComplete) {
          var winners = round.matches.map(getMatchWinner).filter(Boolean);
          var label = winners.length === 1 ? 'Crown champion' : 'Generate next round';
          html += '<button class="btn-primary generate-next-round-btn" data-round-idx="' + roundIdx + '" style="margin-top:12px; width:100%;">' + ICONS.chevron + ' ' + label + '</button>';
        } else {
          html += '<p class="hint-text">Enter all results to continue.</p>';
        }
      }

      html += '</div>'; // bracket-round
    });

    html += '</div>'; // bracket-wrap
    html += '</div>'; // section
    return html;
  }

  function matchRowHtml(t, m, groupId, roundIdx, adminMode, allowDraw) {
    var playerA = t.players.filter(function (p) { return p.id === m.playerA; })[0];
    var playerB = m.playerB ? t.players.filter(function (p) { return p.id === m.playerB; })[0] : null;

    if (m.bye) {
      var html = '<div class="match-row">';
      html += '<div class="match-player"><span class="match-player-name">' + escapeHtml(playerA ? playerA.name : '') + '</span><span class="match-player-team">' + flagEmoji(playerA ? playerA.team : '') + ' ' + escapeHtml(playerA ? playerA.team : '') + '</span></div>';
      html += '<span class="bye-badge">Bye - advances</span>';
      html += '<div class="match-player"><span class="match-player-name">&mdash;</span></div>';
      html += '</div>';
      return html;
    }

    var a = m.scoreA === null || m.scoreA === undefined ? '' : m.scoreA;
    var b = m.scoreB === null || m.scoreB === undefined ? '' : m.scoreB;

    var winnerA = m.completed && a !== '' && b !== '' && Number(a) > Number(b);
    var winnerB = m.completed && a !== '' && b !== '' && Number(b) > Number(a);
    var isDrawCompleted = m.completed && a !== '' && b !== '' && Number(a) === Number(b);

    // For knockout matches level after 90 minutes, penalty winner takes the highlight
    if (!allowDraw && isDrawCompleted) {
      var matchWinnerId = getMatchWinner(m);
      if (matchWinnerId === m.playerA) winnerA = true;
      if (matchWinnerId === m.playerB) winnerB = true;
    }

    var dataAttrs = 'data-match-id="' + m.id + '"';
    if (groupId !== null) dataAttrs += ' data-group-id="' + groupId + '"';
    if (roundIdx !== -1) dataAttrs += ' data-round-idx="' + roundIdx + '"';
    dataAttrs += ' data-allow-draw="' + (allowDraw ? '1' : '0') + '"';

    var html = '<div class="match-row">';
    html += '<div class="match-player' + (winnerA ? ' winner' : '') + '"><span class="match-player-name">' + escapeHtml(playerA ? playerA.name : '') + '</span><span class="match-player-team">' + flagEmoji(playerA ? playerA.team : '') + ' ' + escapeHtml(playerA ? playerA.team : '') + '</span></div>';

    if (adminMode) {
      html += '<div class="score-inputs">';
      html += '<input type="number" min="0" class="score-input score-input-a" ' + dataAttrs + ' value="' + a + '" />';
      html += '<span class="score-dash">-</span>';
      html += '<input type="number" min="0" class="score-input score-input-b" ' + dataAttrs + ' value="' + b + '" />';
      html += '</div>';
    } else {
      var displayScore = m.completed ? (a + ' - ' + b) : 'vs';
      html += '<div class="score-display">' + displayScore + '</div>';
    }

    html += '<div class="match-player right' + (winnerB ? ' winner' : '') + '"><span class="match-player-name">' + escapeHtml(playerB ? playerB.name : '') + '</span><span class="match-player-team">' + flagEmoji(playerB ? playerB.team : '') + ' ' + escapeHtml(playerB ? playerB.team : '') + '</span></div>';

    // Penalty shootout for knockout matches level after 90 minutes
    if (!allowDraw && isDrawCompleted) {
      var penA = m.penA === null || m.penA === undefined ? '' : m.penA;
      var penB = m.penB === null || m.penB === undefined ? '' : m.penB;
      var penDataAttrs = 'data-match-id="' + m.id + '"';
      if (roundIdx !== -1) penDataAttrs += ' data-round-idx="' + roundIdx + '"';

      html += '<div class="penalty-section">';
      html += '<span class="penalty-label">Penalties</span>';
      if (adminMode) {
        html += '<input type="number" min="0" class="penalty-input penalty-input-a" ' + penDataAttrs + ' value="' + penA + '" />';
        html += '<span class="score-dash">-</span>';
        html += '<input type="number" min="0" class="penalty-input penalty-input-b" ' + penDataAttrs + ' value="' + penB + '" />';
      } else {
        var penDisplay = (penA !== '' && penB !== '') ? (penA + ' - ' + penB) : 'TBD';
        html += '<span class="penalty-display">' + penDisplay + '</span>';
      }
      html += '</div>';

      if (adminMode && (penA === '' || penB === '' || Number(penA) === Number(penB))) {
        html += '<p class="hint-text" style="width:100%; text-align:center;">Enter penalty shootout scores (no draws) to determine the winner.</p>';
      }
    }

    html += '</div>';
    return html;
  }

  // ---------------- Event handlers ----------------
  function attachEventHandlers(adminMode, selected) {
    // Sidebar selection
    document.querySelectorAll('[data-select-id]').forEach(function (el) {
      el.addEventListener('click', function () {
        state.selectedTournamentId = el.getAttribute('data-select-id');
        state.editingPlayerId = null;
        render();
      });
    });

    // Sidebar delete
    document.querySelectorAll('[data-delete-id]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = el.getAttribute('data-delete-id');
        if (!confirm('Delete this tournament permanently?')) return;
        state.tournaments = state.tournaments.filter(function (t) { return t.id !== id; });
        if (state.selectedTournamentId === id) {
          state.selectedTournamentId = state.tournaments.length > 0 ? state.tournaments[0].id : null;
        }
        persist();
        render();
      });
    });

    // New tournament button
    var newBtn = document.getElementById('new-tournament-btn');
    if (newBtn) {
      newBtn.addEventListener('click', function () {
        document.getElementById('new-tournament-name').value = '';
        document.getElementById('new-modal').classList.remove('hidden');
        document.getElementById('new-tournament-name').focus();
      });
    }

    if (!selected) return;

    // Edit tournament name
    var editNameBtn = document.getElementById('edit-name-btn');
    if (editNameBtn) {
      editNameBtn.addEventListener('click', function () {
        var wrap = document.getElementById('tournament-name-wrap');
        wrap.innerHTML = '<div class="name-edit-row"><input id="edit-name-input" value="' + escapeHtml(selected.name) + '" /><button id="save-name-btn" class="icon-btn">' + ICONS.check + '</button><button id="cancel-name-btn" class="icon-btn">' + ICONS.x + '</button></div>';
        var input = document.getElementById('edit-name-input');
        input.focus();
        input.select();
        document.getElementById('save-name-btn').addEventListener('click', saveNameEdit);
        document.getElementById('cancel-name-btn').addEventListener('click', render);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') saveNameEdit();
        });
      });
    }

    function saveNameEdit() {
      var val = document.getElementById('edit-name-input').value.trim();
      updateTournament(selected.id, function (t) {
        return Object.assign({}, t, { name: val || t.name });
      });
    }

    // Add player
    var addPlayerBtn = document.getElementById('add-player-btn');
    if (addPlayerBtn) {
      addPlayerBtn.addEventListener('click', addPlayer);
      ['new-player-name', 'new-player-team'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') addPlayer();
        });
      });
    }

    function addPlayer() {
      var nameInput = document.getElementById('new-player-name');
      var teamInput = document.getElementById('new-player-team');
      var name = nameInput.value.trim();
      var team = teamInput.value.trim();
      if (!name || !team) return;
      updateTournament(selected.id, function (t) {
        var players = t.players.concat([{ id: uid('player'), name: name, team: team }]);
        return Object.assign({}, t, { players: players });
      });
    }

    // Edit player (start)
    document.querySelectorAll('.edit-player-btn').forEach(function (el) {
      el.addEventListener('click', function () {
        state.editingPlayerId = el.getAttribute('data-id');
        render();
      });
    });

    // Cancel edit player
    document.querySelectorAll('.cancel-edit-player-btn').forEach(function (el) {
      el.addEventListener('click', function () {
        state.editingPlayerId = null;
        render();
      });
    });

    // Save player edit
    document.querySelectorAll('.save-player-btn').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        var nameInput = document.querySelector('.edit-player-name[data-id="' + id + '"]');
        var teamInput = document.querySelector('.edit-player-team[data-id="' + id + '"]');
        var newName = nameInput.value.trim();
        var newTeam = teamInput.value.trim();
        updateTournament(selected.id, function (t) {
          var players = t.players.map(function (p) {
            if (p.id !== id) return p;
            return Object.assign({}, p, {
              name: newName || p.name,
              team: newTeam || p.team
            });
          });
          return Object.assign({}, t, { players: players });
        });
        state.editingPlayerId = null;
      });
    });

    // Remove player
    document.querySelectorAll('.remove-player-btn').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-id');
        updateTournament(selected.id, function (t) {
          return Object.assign({}, t, { players: t.players.filter(function (p) { return p.id !== id; }) });
        });
      });
    });

    // Start tournament (generate groups)
    var startBtn = document.getElementById('start-tournament-btn');
    if (startBtn) {
      startBtn.addEventListener('click', function () {
        if (selected.players.length < 2) {
          alert('Add at least 2 players to start the tournament.');
          return;
        }
        updateTournament(selected.id, function (t) {
          var playerIds = t.players.map(function (p) { return p.id; });
          var groupsRaw = makeGroups(playerIds);
          var groups = groupsRaw.map(function (ids) { return { id: uid('group'), playerIds: ids }; });
          var groupMatches = {};
          groups.forEach(function (g) {
            groupMatches[g.id] = roundRobinMatches(g.playerIds);
          });
          return Object.assign({}, t, { status: 'group', groups: groups, groupMatches: groupMatches });
        });
      });
    }

    // Group match score inputs
    document.querySelectorAll('.match-row .score-input').forEach(function (el) {
      el.addEventListener('input', function () {
        handleScoreChange(el);
      });
    });

    // Penalty shootout inputs
    document.querySelectorAll('.match-row .penalty-input').forEach(function (el) {
      el.addEventListener('input', function () {
        handlePenaltyChange(el);
      });
    });

    function handlePenaltyChange(el) {
      var matchId = el.getAttribute('data-match-id');
      var roundIdxAttr = el.getAttribute('data-round-idx');
      var roundIdx = Number(roundIdxAttr);

      var row = el.closest('.match-row');
      var aInput = row.querySelector('.penalty-input-a');
      var bInput = row.querySelector('.penalty-input-b');
      var aVal = aInput.value;
      var bVal = bInput.value;
      var penA = aVal === '' ? null : Number(aVal);
      var penB = bVal === '' ? null : Number(bVal);

      updateTournament(selected.id, function (t) {
        var rounds = t.knockoutRounds.map(function (r, i) {
          if (i !== roundIdx) return r;
          var matches = r.matches.map(function (m) {
            if (m.id !== matchId) return m;
            return Object.assign({}, m, { penA: penA, penB: penB });
          });
          return Object.assign({}, r, { matches: matches });
        });
        return Object.assign({}, t, { knockoutRounds: rounds });
      });
    }

    function handleScoreChange(el) {
      var matchId = el.getAttribute('data-match-id');
      var groupId = el.getAttribute('data-group-id');
      var roundIdxAttr = el.getAttribute('data-round-idx');
      var allowDraw = el.getAttribute('data-allow-draw') === '1';

      var row = el.closest('.match-row');
      var aInput = row.querySelector('.score-input-a');
      var bInput = row.querySelector('.score-input-b');
      var aVal = aInput.value;
      var bVal = bInput.value;
      var numA = aVal === '' ? null : Number(aVal);
      var numB = bVal === '' ? null : Number(bVal);

      if (groupId) {
        // Group stage match
        updateTournament(selected.id, function (t) {
          var matches = t.groupMatches[groupId].map(function (m) {
            if (m.id !== matchId) return m;
            var completed = numA !== null && numB !== null;
            return Object.assign({}, m, { scoreA: numA, scoreB: numB, completed: completed });
          });
          var groupMatches = Object.assign({}, t.groupMatches);
          groupMatches[groupId] = matches;
          return Object.assign({}, t, { groupMatches: groupMatches });
        });
      } else {
        // Knockout match
        var roundIdx = Number(roundIdxAttr);
        updateTournament(selected.id, function (t) {
          var completed = numA !== null && numB !== null;
          var rounds = t.knockoutRounds.map(function (r, i) {
            if (i !== roundIdx) return r;
            var matches = r.matches.map(function (m) {
              if (m.id !== matchId) return m;
              var updated = Object.assign({}, m, { scoreA: numA, scoreB: numB, completed: completed });
              // Clear penalties if scores are no longer level
              if (numA !== numB) {
                updated.penA = null;
                updated.penB = null;
              }
              return updated;
            });
            return Object.assign({}, r, { matches: matches });
          });
          return Object.assign({}, t, { knockoutRounds: rounds });
        });
      }
    }

    // Advance to knockout
    var advanceBtn = document.getElementById('advance-knockout-btn');
    if (advanceBtn) {
      advanceBtn.addEventListener('click', function () {
        updateTournament(selected.id, function (t) {
          var advancingIds = [];
          t.groups.forEach(function (g) {
            var standings = calcStandings(g.playerIds, t.groupMatches[g.id]);
            var count = advanceCount(g.playerIds.length);
            standings.slice(0, count).forEach(function (s) { advancingIds.push(s.id); });
          });
          var round = makeKnockoutMatches(advancingIds, knockoutRoundLabel(advancingIds.length));
          return Object.assign({}, t, { status: 'knockout', knockoutRounds: [round] });
        });
      });
    }

    // Generate next round / crown champion
    document.querySelectorAll('.generate-next-round-btn').forEach(function (el) {
      el.addEventListener('click', function () {
        var roundIdx = Number(el.getAttribute('data-round-idx'));
        updateTournament(selected.id, function (t) {
          var round = t.knockoutRounds[roundIdx];
          var winners = round.matches.map(getMatchWinner).filter(Boolean);

          if (winners.length === 1) {
            return Object.assign({}, t, { status: 'completed', champion: winners[0] });
          }

          var nextRound = makeKnockoutMatches(winners, knockoutRoundLabel(winners.length));
          return Object.assign({}, t, { knockoutRounds: t.knockoutRounds.concat([nextRound]) });
        });
      });
    });
  }

  // ---------------- View toggle / login ----------------
  document.getElementById('btn-public').addEventListener('click', function () {
    state.view = 'public';
    render();
  });

  document.getElementById('btn-admin').addEventListener('click', function () {
    if (state.isAdminAuthed) {
      state.view = 'admin';
    } else {
      state.view = 'login';
    }
    render();
  });

  document.getElementById('login-back-btn').addEventListener('click', function () {
    state.view = 'public';
    document.getElementById('passcode-error').classList.add('hidden');
    document.getElementById('passcode-input').value = '';
    render();
  });

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('passcode-input');
    var errEl = document.getElementById('passcode-error');
    if (input.value === ADMIN_PASSCODE) {
      state.isAdminAuthed = true;
      state.view = 'admin';
      errEl.classList.add('hidden');
      input.value = '';
      render();
    } else {
      errEl.classList.remove('hidden');
    }
  });

  // ---------------- New tournament modal ----------------
  document.getElementById('new-modal-cancel').addEventListener('click', function () {
    document.getElementById('new-modal').classList.add('hidden');
  });
  document.getElementById('new-modal').addEventListener('click', function (e) {
    if (e.target.id === 'new-modal') document.getElementById('new-modal').classList.add('hidden');
  });
  document.getElementById('new-tournament-name').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('new-modal-create').click();
  });
  document.getElementById('new-modal-create').addEventListener('click', function () {
    var nameInput = document.getElementById('new-tournament-name');
    var name = nameInput.value.trim() || ('Tournament ' + (state.tournaments.length + 1));
    var t = newTournament(name);
    state.tournaments = [t].concat(state.tournaments);
    state.selectedTournamentId = t.id;
    document.getElementById('new-modal').classList.add('hidden');
    persist();
    render();
  });

  // ---------------- Init ----------------
  (async function init() {
    state.tournaments = await loadTournaments();
    if (state.tournaments.length > 0) {
      state.selectedTournamentId = state.tournaments[0].id;
    }
    render();

    // Poll for updates from other viewers every 8 seconds.
    // Skip refresh while the admin is mid-edit to avoid clobbering input.
    setInterval(async function () {
      if (state.editingPlayerId !== null) return;
      if (document.getElementById('edit-name-input')) return;
      if (saveTimeout) return; // a local save is pending/in-flight

      var fresh = await loadTournaments();
      var freshStr = JSON.stringify(fresh);
      var currentStr = JSON.stringify(state.tournaments);
      if (freshStr !== currentStr) {
        state.tournaments = fresh;
        if (state.selectedTournamentId && !fresh.some(function (t) { return t.id === state.selectedTournamentId; })) {
          state.selectedTournamentId = fresh.length > 0 ? fresh[0].id : null;
        }
        render();
      }
    }, 8000);
  })();
